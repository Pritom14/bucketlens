[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bucketlens"
version = "0.1.0"
description = "Let any AI agent read the documents and spreadsheets in your own S3 or R2 bucket: outlines, pages, rows, SQL and search, without downloading the files."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Pritom Mazumdar" }]
keywords = ["mcp", "agents", "s3", "r2", "pdf", "excel", "llm", "documents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "boto3>=1.34",
  "duckdb>=1.2",
  "pypdfium2>=4.30",
  "openpyxl>=3.1",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[server]>=5", "fpdf2>=2.7", "xlsxwriter>=3.1", "ruff>=0.6"]

[project.scripts]
bucketlens = "bucketlens.cli:main"

[project.urls]
Homepage = "https://github.com/Pritom14/bucketlens"

[tool.hatch.build.targets.wheel]
packages = ["src/bucketlens"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["benchmarks/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
